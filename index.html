<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enxoval NOSSA CASA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { 'casanova-bg': '#FAF5F7', 'casanova-primary': '#D1A3B4', 'casanova-secondary': '#A3B4D1' } } } }
    </script>
    <style> .hidden { display: none; } </style>
</head>
<body class="bg-casanova-bg text-gray-700 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto mb-6 flex justify-center">
        <div class="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 flex gap-2 w-full md:w-auto">
            <button onclick="mudarAba('compras')" id="aba-compras" class="flex-1 md:w-64 py-3 rounded-xl font-bold text-sm transition-all bg-casanova-primary text-white shadow-md">
                <i class="fas fa-shopping-cart mr-2"></i>Lista de Compras
            </button>
            <button onclick="mudarAba('checklist')" id="aba-checklist" class="flex-1 md:w-64 py-3 rounded-xl font-bold text-sm transition-all text-gray-500 hover:bg-gray-50">
                <i class="fas fa-list-check mr-2"></i>Checklist de Ideias
            </button>
        </div>
    </div>

    <header class="max-w-6xl mx-auto mb-8 text-center relative" id="header-compras">
<h1 class="text-4xl md:text-5xl font-bold text-casanova-primary mb-2 tracking-wide" style="font-family: serif;">
            <i class="fas fa-home mr-2"></i>Casa Nova
        </h1>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><p class="text-[10px] uppercase font-bold text-gray-400">Total Estimado</p><p class="text-lg font-bold" id="total-estimado">R$ 0,00</p></div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100"><p class="text-[10px] uppercase font-bold text-green-400">Já Pago</p><p class="text-lg font-bold text-green-600" id="total-pago">R$ 0,00</p></div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-red-100"><p class="text-[10px] uppercase font-bold text-red-400">A Pagar (Total)</p><p class="text-lg font-bold text-red-500" id="total-divida">R$ 0,00</p></div>
            <div class="bg-casanova-secondary bg-opacity-10 p-4 rounded-xl shadow-sm border border-casanova-secondary"><p class="text-[10px] uppercase font-bold text-casanova-secondary">Parcelas Próx. Mês</p><p class="text-lg font-bold text-gray-700" id="total-proximo-mes">R$ 0,00</p></div>
        </div>

        <div class="max-w-xl mx-auto mb-8">
            <div class="flex justify-between text-[11px] font-bold mb-1 px-1"><span class="text-casanova-primary">Progresso do Enxoval</span><span id="progress-text">0%</span></div>
            <div class="w-full bg-gray-200 rounded-full h-2.5"><div id="progress-bar-geral" class="bg-casanova-primary h-2.5 rounded-full transition-all duration-700" style="width: 0%"></div></div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-4 border border-gray-50">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-300"></i>
                    <input type="text" id="search-bar" placeholder="Pesquisar item ou tag..." class="w-full pl-10 p-2 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-casanova-primary">
                </div>
                <button id="btn-open-modal" class="bg-casanova-primary hover:bg-opacity-80 text-white px-6 py-2 rounded-xl font-bold transition-all shadow-md whitespace-nowrap"><i class="fas fa-plus mr-2"></i>Novo Item</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1" id="category-filters">
                <button class="cat-btn active px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-casanova-primary text-white">Todas</button>
                <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-gray-100 text-gray-500">Cozinha</button>
                <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-gray-100 text-gray-500">Sala</button>
                <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-gray-100 text-gray-500">Quarto</button>
                <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-gray-100 text-gray-500">Banheiro</button>
                <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-gray-100 text-gray-500">Lavanderia</button>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1 border-t border-gray-50 pt-3" id="status-filters">
                <button class="status-btn active px-4 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider whitespace-nowrap bg-gray-800 text-white">Todos</button>
                <button class="status-btn px-4 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider whitespace-nowrap bg-gray-100 text-gray-500">Pendentes</button>
                <button class="status-btn px-4 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider whitespace-nowrap bg-gray-100 text-gray-500">Pagando</button>
                <button class="status-btn px-4 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider whitespace-nowrap bg-gray-100 text-gray-500">Concluídos</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto mb-20" id="view-compras">
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

<main class="max-w-6xl mx-auto mb-20 hidden" id="view-checklist">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Checklist de Ideias</h2>
            <p class="text-gray-500 text-sm mb-4">Itens clássicos que talvez a casa precise. Adicione à lista de compras ou descarte.</p>
            <div class="flex flex-col md:flex-row gap-4 max-w-lg mx-auto">
                <input type="text" id="novo-item-check-nome" placeholder="Nome do novo item..." class="flex-1 p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-casanova-primary">
                <select id="novo-item-check-cat" class="p-3 border border-gray-200 rounded-xl outline-none">
                    <option>Cozinha</option><option>Sala</option><option>Quarto</option><option>Banheiro</option><option>Lavanderia</option><option>Escritório</option><option>Outros</option>
                </select>
                <button id="btn-add-checklist" onclick="adicionarAoChecklist()" class="bg-gray-800 text-white font-bold px-6 py-3 rounded-xl hover:bg-gray-900 transition-colors shadow-md">ADICIONAR</button>
            </div>
        </div>
        <div id="checklist-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <div id="item-modal" class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center"><i class="fas fa-edit mr-3 text-casanova-primary"></i> <span id="modal-title">Novo Item</span></h2>
            <form id="item-form" class="space-y-4">
                <input type="hidden" id="input-id">
                <input type="hidden" id="checklist-origin-id"> <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-gray-400 ml-1">NOME DO ITEM</label><input type="text" id="input-nome" required class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"></div>
                    <div><label class="text-xs font-bold text-gray-400 ml-1">CATEGORIA</label>
                        <select id="input-categoria" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"><option>Cozinha</option><option>Sala</option><option>Quarto</option><option>Banheiro</option><option>Lavanderia</option><option>Escritório</option><option>Outros</option></select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="text-xs font-bold text-gray-400 ml-1">STATUS</label>
                        <select id="input-status" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none" onchange="uiToggleCampos()"><option value="Pendente">Pendente</option><option value="Comprado">Comprado</option><option value="Ganhamos">Ganhamos</option></select>
                    </div>
                    <div><label class="text-xs font-bold text-gray-400 ml-1">VALOR ESTIMADO</label><input type="number" step="0.01" id="input-valor-estimado" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"></div>
                    <div><label class="text-xs font-bold text-gray-400 ml-1">PRIORIDADE</label>
                        <select id="input-prioridade" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"><option value="1-Essencial">1 - Essencial</option><option value="2-Funcional">2 - Funcional</option><option value="3-Estética">3 - Estética</option></select>
                    </div>
                </div>

                <div id="finance-section" class="hidden bg-casanova-bg bg-opacity-40 p-4 rounded-2xl border border-casanova-primary border-opacity-10 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-gray-400 ml-1">VALOR FINAL PAGO</label><input type="number" step="0.01" id="input-valor-final" class="w-full p-3 bg-white border-none rounded-xl outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-400 ml-1">FORMA DE PAGAMENTO</label>
                            <select id="input-forma-pag" class="w-full p-3 bg-white border-none rounded-xl outline-none" onchange="uiToggleCampos()"><option>À vista</option><option>Parcelado</option></select>
                        </div>
                    </div>
                    <div id="parcelas-row" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="text-xs font-bold text-gray-400 ml-1">QTD PARCELAS</label><input type="number" id="input-qtd-parcelas" class="w-full p-3 bg-white border-none rounded-xl outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-400 ml-1">JÁ PAGAS</label><input type="number" id="input-parcelas-pagas" class="w-full p-3 bg-white border-none rounded-xl outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-400 ml-1">DIA VENCIMENTO</label><input type="number" id="input-vencimento" placeholder="Ex: 15" class="w-full p-3 bg-white border-none rounded-xl outline-none"></div>
                    </div>
                </div>

                <div id="gift-section" class="hidden bg-purple-50 p-4 rounded-2xl border border-purple-100">
                    <label class="text-xs font-bold text-purple-400 ml-1">QUEM DEU O PRESENTE?</label><input type="text" id="input-quem-deu" class="w-full p-3 bg-white border-none rounded-xl outline-none placeholder-purple-200">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-gray-400 ml-1">URL DA IMAGEM</label><input type="url" id="input-imagem" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"></div>
                    <div><label class="text-xs font-bold text-gray-400 ml-1">TAGS (SEPARAR POR VÍRGULA)</label><input type="text" id="input-tags" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none"></div>
                </div>
                <div><label class="text-xs font-bold text-gray-400 ml-1">OBSERVAÇÕES</label><textarea id="input-obs" rows="2" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none resize-none"></textarea></div>

                <div id="links-container" class="space-y-2 pt-2"></div>
                <button type="button" onclick="uiCriarLinhaLink('', '')" class="text-xs font-bold text-casanova-secondary hover:text-casanova-primary">+ ADICIONAR LINK DE LOJA</button>

                <div class="flex justify-between items-center pt-6 border-t border-gray-100">
                    <button type="button" id="btn-delete-trigger" class="text-red-400 hover:text-red-600 font-bold text-sm hidden uppercase tracking-widest"><i class="fas fa-trash-alt mr-2"></i>Excluir</button>
                    <div class="flex gap-4 ml-auto">
                        <button type="button" onclick="fecharModal()" class="px-6 py-3 text-gray-400 font-bold hover:text-gray-600 transition-colors">CANCELAR</button>
                        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg transition-all">SALVAR ITEM</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
