<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enxoval Casa Nova</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'casanova-bg': '#FAF5F7',
                        'casanova-primary': '#D1A3B4',
                        'casanova-secondary': '#A3B4D1',
                        'casanova-text': '#4A4A4A'
                    }
                }
            }
        }
    </script>
    <style>
        /* Esconde o modal por padrão */
        .hidden { display: none; }
    </style>
</head>
<body class="bg-casanova-bg text-casanova-text font-sans antialiased p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-casanova-primary mb-2 tracking-wide" style="font-family: serif;">
            <i class="fas fa-home mr-2"></i>Casa Nova
        </h1>
        <p class="text-lg text-gray-500 mb-6">Checklist e Organização do Enxoval</p>

        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 w-48">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Custo Estimado</p>
                <p class="text-2xl font-bold text-gray-800" id="total-estimado">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 w-48">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Já Gasto</p>
                <p class="text-2xl font-bold text-casanova-primary" id="total-gasto">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 w-48">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Itens Comprados</p>
                <p class="text-2xl font-bold text-gray-800" id="total-itens">0 / 0</p>
            </div>
        </div>

        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0" id="category-filters">
                <button class="px-4 py-2 bg-casanova-primary text-white rounded-full text-sm font-semibold whitespace-nowrap">Todas</button>
                <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-semibold whitespace-nowrap">Cozinha</button>
                <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-semibold whitespace-nowrap">Sala</button>
                <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-semibold whitespace-nowrap">Quarto</button>
                <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-semibold whitespace-nowrap">Banheiro</button>
            </div>
            
            <button id="btn-open-modal" class="bg-casanova-primary hover:bg-pink-400 text-white px-6 py-2 rounded-full font-bold shadow-md transition-colors whitespace-nowrap ml-4">
                <i class="fas fa-plus mr-1"></i> Novo Item
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex items-center justify-center h-48 text-gray-400 italic">
                <p><i class="fas fa-spinner fa-spin mr-2"></i> Carregando itens...</p>
            </div>
        </div>
    </main>

    <div id="item-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4 p-6 relative">
            
            <button id="btn-close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl">
                <i class="fas fa-times"></i>
            </button>

            <h2 class="text-2xl font-bold text-casanova-primary mb-6 border-b pb-2">Adicionar Novo Item</h2>

            <form id="item-form" class="space-y-4">
                <input type="hidden" id="input-id" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Item</label>
                        <input type="text" id="input-nome" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-casanova-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Categoria</label>
                        <select id="input-categoria" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                            <option value="Cozinha">Cozinha</option>
                            <option value="Sala">Sala</option>
                            <option value="Quarto">Quarto</option>
                            <option value="Banheiro">Banheiro</option>
                            <option value="Lavanderia">Lavanderia</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
                        <select id="input-status" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                            <option value="Pendente">Pendente</option>
                            <option value="Comprado">Comprado</option>
                            <option value="Ganhamos">Ganhamos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Prioridade</label>
                        <select id="input-prioridade" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                            <option value="1-Essencial">1 - Essencial (Sobrevivência)</option>
                            <option value="2-Funcional">2 - Funcional (Conforto)</option>
                            <option value="3-Estética">3 - Estética (Detalhes)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Valor Estimado (R$)</label>
                        <input type="number" step="0.01" id="input-valor-estimado" class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Valor Pago (R$)</label>
                        <input type="number" step="0.01" id="input-valor-pago" class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tags (separar por vírgula)</label>
                        <input type="text" id="input-tags" placeholder="ex: 220v, inox, eletro" class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">URL da Imagem de Referência</label>
                    <input type="url" id="input-imagem" placeholder="https://..." class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-gray-700">Links de Compra</label>
                        <button type="button" id="btn-add-link-field" class="text-xs bg-casanova-secondary text-white px-2 py-1 rounded hover:bg-blue-400">
                            + Adicionar Link
                        </button>
                    </div>
                    
                    <div id="links-container" class="space-y-2">
                        <div class="flex gap-2 link-row">
                            <input type="text" placeholder="Loja (Ex: Amazon)" class="w-1/3 p-2 border border-gray-300 rounded text-sm outline-none link-loja">
                            <input type="url" placeholder="URL do produto" class="w-2/3 p-2 border border-gray-300 rounded text-sm outline-none link-url">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Observações</label>
                    <textarea id="input-obs" rows="2" class="w-full p-2 border border-gray-300 rounded-lg outline-none resize-none" placeholder="Medidas, especificações, quem deu de presente..."></textarea>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t">
                    <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-semibold transition-colors">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold shadow-md transition-colors">
                        <i class="fas fa-save mr-1"></i> Salvar Item
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
