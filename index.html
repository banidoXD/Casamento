<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enxoval NOSSA CASA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'casanova-bg': '#FAF5F7',
                        'casanova-primary': '#D1A3B4',
                        'casanova-secondary': '#A3B4D1',
                        'casanova-text': '#4A4A4A'
                    }
                }
            }
        }
    </script>
    <style>
        /* Esconde o modal por padrão */
        .hidden { display: none; }
    </style>
</head>
<body class="bg-casanova-bg text-casanova-text font-sans antialiased p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-casanova-primary mb-2 tracking-wide" style="font-family: serif;">
            <i class="fas fa-home mr-2"></i>NOSSA CASA
        </h1>
        
        <div class="max-w-2xl mx-auto mb-6">
            <div class="flex justify-between text-xs text-gray-500 mb-1 font-bold">
                <span>Progresso do Enxoval</span>
                <span id="progress-text">0% Concluído</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div class="bg-casanova-primary h-3 rounded-full transition-all duration-500" id="progress-bar-geral" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 w-40 md:w-48">
                <p class="text-xs md:text-sm text-gray-500 uppercase tracking-wider">Estimado</p>
                <p class="text-xl md:text-2xl font-bold text-gray-800" id="total-estimado">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 w-40 md:w-48">
                <p class="text-xs md:text-sm text-gray-500 uppercase tracking-wider">Já Pago</p>
                <p class="text-xl md:text-2xl font-bold text-green-600" id="total-pago">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-red-100 w-40 md:w-48 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-red-100 text-red-600 text-[10px] px-2 py-1 rounded-bl-lg font-bold">Dívida</div>
                <p class="text-xs md:text-sm text-gray-500 uppercase tracking-wider">A Pagar</p>
                <p class="text-xl md:text-2xl font-bold text-red-500" id="total-divida">R$ 0,00</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                
                <div class="flex flex-1 w-full gap-4 items-center">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="search-bar" placeholder="Pesquisar item ou tag..." class="w-full pl-10 p-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-casanova-primary">
                    </div>
                    <label class="flex items-center space-x-2 cursor-pointer text-sm font-semibold text-gray-600 whitespace-nowrap">
                        <input type="checkbox" id="toggle-pendentes" class="w-4 h-4 text-casanova-primary border-gray-300 rounded focus:ring-casanova-primary">
                        <span>Ocultar Concluídos</span>
                    </label>
                </div>

                <button id="btn-open-modal" class="w-full md:w-auto bg-casanova-primary hover:bg-pink-400 text-white px-6 py-2 rounded-lg font-bold shadow-md transition-colors whitespace-nowrap">
                    <i class="fas fa-plus mr-1"></i> Novo Item
                </button>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2" id="category-filters">
                <button class="px-4 py-1 bg-casanova-primary text-white rounded-full text-sm font-semibold whitespace-nowrap">Todas</button>
                <button class="px-4 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-semibold whitespace-nowrap">Cozinha</button>
                <button class="px-4 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-semibold whitespace-nowrap">Sala</button>
                <button class="px-4 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-semibold whitespace-nowrap">Quarto</button>
                <button class="px-4 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-semibold whitespace-nowrap">Banheiro</button>
                <button class="px-4 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-semibold whitespace-nowrap">Lavanderia</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto mb-10">
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="item-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4 p-6 relative">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold text-casanova-primary mb-6 border-b pb-2">Adicionar Novo Item</h2>

            <form id="item-form" class="space-y-4">
                <input type="hidden" id="input-id" value="">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Item</label>
                        <input type="text" id="input-nome" required class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Categoria</label>
                        <select id="input-categoria" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                            <option value="Cozinha">Cozinha</option><option value="Sala">Sala</option><option value="Quarto">Quarto</option><option value="Banheiro">Banheiro</option><option value="Lavanderia">Lavanderia</option><option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
                        <select id="input-status" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white" onchange="toggleCamposCondicionais()">
                            <option value="Pendente">Pendente</option><option value="Comprado">Comprado</option><option value="Ganhamos">Ganhamos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Prioridade</label>
                        <select id="input-prioridade" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white">
                            <option value="1-Essencial">1 - Essencial</option><option value="2-Funcional">2 - Funcional</option><option value="3-Estética">3 - Estética</option>
                        </select>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Valor Estimado (R$)</label>
                            <input type="number" step="0.01" id="input-valor-estimado" class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                        </div>
                        <div id="div-valor-final" class="hidden">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Valor Total Produto (R$)</label>
                            <input type="number" step="0.01" id="input-valor-final" class="w-full p-2 border border-gray-300 rounded-lg outline-none border-green-300">
                        </div>
                        <div id="div-quem-deu" class="hidden md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Quem deu o presente?</label>
                            <input type="text" id="input-quem-deu" placeholder="Ex: Tios do noivo" class="w-full p-2 border border-gray-300 rounded-lg outline-none">
                        </div>
                    </div>

                    <div id="sessao-parcelas" class="hidden border-t border-blue-200 pt-3">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Forma Pag.</label>
                                <select id="input-forma-pag" class="w-full p-2 border border-gray-300 rounded-lg outline-none bg-white" onchange="toggleCamposCondicionais()">
                                    <option value="À vista">À vista</option><option value="Parcelado">Parcelado</option>
                                </select>
                            </div>
                            <div class="campo-parcela hidden">
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Qtd Parcelas</label>
                                <input type="number" id="input-qtd-parcelas" class="w-full p-2 border border-gray-300 rounded-lg outline-none" value="1">
                            </div>
                            <div class="campo-parcela hidden">
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Já Pagas</label>
                                <input type="number" id="input-parcelas-pagas" class="w-full p-2 border border-gray-300 rounded-lg outline-none" value="0">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1">URL Imagem</label><input type="url" id="input-imagem" class="w-full p-2 border border-gray-300 rounded-lg outline-none"></div>
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1">Tags (,)</label><input type="text" id="input-tags" class="w-full p-2 border border-gray-300 rounded-lg outline-none"></div>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-gray-700">Links de Compra</label>
                        <button type="button" id="btn-add-link-field" class="text-xs bg-casanova-secondary text-white px-2 py-1 rounded">+ Link</button>
                    </div>
                    <div id="links-container" class="space-y-2"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Observações</label>
                    <textarea id="input-obs" rows="2" class="w-full p-2 border border-gray-300 rounded-lg outline-none resize-none"></textarea>
                </div>

                <div class="pt-4 flex justify-between items-center border-t">
                    <button type="button" id="btn-delete-item" class="text-red-500 hover:text-red-700 text-sm font-bold hidden"><i class="fas fa-trash mr-1"></i> Excluir</button>
                    <div class="flex gap-3 ml-auto">
                        <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-semibold">Cancelar</button>
                        <button type="submit" class="px-6 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold shadow-md"><i class="fas fa-save mr-1"></i> Salvar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
